<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zunesty ICP Scanner</title>
<style>
  :root {
    --bg: #0c0d0f; --card: #17181c; --card2: #1e2025; --line: #26282e;
    --text: #f2f3f5; --dim: #8b8f98; --accent: #4da3ff;
    --green: #34c98e; --orange: #f5a623; --gray: #6f7480; --red: #ef6461; --purple: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 12px;
  }
  .app { width: 430px; max-width: 100%; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: .04em; }
  .brand span { color: var(--accent); }
  .btn {
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #08131f; }
  .btn:hover { filter: brightness(1.1); }

  .drop {
    margin: 14px; border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 34px 16px; text-align: center; color: var(--dim); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: rgba(77,163,255,.06); }
  .drop b { color: var(--text); display: block; margin-bottom: 4px; font-size: 13px; }

  .summary {
    display: none; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .pill {
    font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
    background: var(--card2); border: 1px solid var(--line); color: var(--dim);
  }
  .pill i { font-style: normal; color: var(--text); }
  .progress { display: none; padding: 10px 16px; color: var(--dim); font-size: 12px;
    border-bottom: 1px solid var(--line); }
  .bar { height: 3px; background: var(--card2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar div { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }

  .list { max-height: 520px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .who { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .row .sub { color: var(--dim); font-size: 11px; margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .chip { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    white-space: nowrap; letter-spacing: .02em; }
  .chip.drift     { color: var(--green);  background: rgba(52,201,142,.12); }
  .chip.allgood_likely   { color: var(--red);    background: rgba(239,100,97,.14); }
  .chip.allgood_possible { color: var(--orange); background: rgba(245,166,35,.11); }
  .chip.migrated  { color: var(--orange); background: rgba(245,166,35,.13); }
  .chip.reply     { color: var(--accent); background: rgba(77,163,255,.12); }
  .chip.broadcast { color: var(--purple); background: rgba(167,139,250,.13); }
  .chip.none      { color: var(--gray);   background: rgba(111,116,128,.15); }
  .chip.dark      { color: var(--gray);   background: rgba(111,116,128,.15); }
  .vendor { font-size: 10px; color: var(--dim); margin-top: 3px; }
  .pill.filter { cursor: pointer; user-select: none; }
  .pill.filter.on { border-color: var(--accent); background: rgba(77,163,255,.14); }
  .chip.error    { color: var(--red);    background: rgba(239,100,97,.13); }
  .chip.pending  { color: var(--dim);    background: var(--card2); }
  .wild { color: var(--purple); font-size: 10px; margin-left: 5px; }

  .footer { display: none; padding: 12px 14px; border-top: 1px solid var(--line);
    justify-content: space-between; align-items: center; }
  .footer .note { color: var(--dim); font-size: 11px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="topbar">
      <div class="brand">ZUNESTY <span>ICP Scanner</span></div>
      <button class="btn" id="pickBtn">Upload CSV</button>
      <input type="file" id="file" accept=".csv,text/csv">
    </div>

    <div class="drop" id="drop">
      <b>Drop a CSV here</b>
      Needs a domain column (e.g. <code>BaseDomain</code>). A <code>DriftMXDomain</code>
      column is used when present; otherwise 15 reply subdomains are probed.
    </div>

    <div class="summary" id="summary"></div>
    <div class="progress" id="progress"><span id="ptext"></span><div class="bar"><div id="pbar"></div></div></div>
    <div class="list" id="list"></div>

    <div class="footer" id="footer">
      <span class="note"><b id="segnote"></b><br>Evidence = live MX records via DNS-over-HTTPS.
        Reproduce any row: <code>dig MX &lt;subdomain&gt;</code></span>
      <button class="btn primary" id="exportBtn">Export CSV</button>
    </div>
  </div>
</div>

<script>
// ---- Fingerprints (derived by Phase 0 on 2026-07-29 — edit here, nothing else) ----
const FP = {
  mx_hosts: ["driftmail.net", "siftrock.com"],      // siftrock = legacy Drift infra

  // --- Competitor (allGood) -------------------------------------------------
  // allGood's hosted mailbox tells customers to point their reply subdomain at
  // SendGrid's INBOUND PARSE host. That hostname is NOT exclusive to allGood --
  // every SendGrid inbound-parse user shares it -- so an MX match alone can
  // never confirm allGood. It is matched on the EXACT host (mx.sendgrid.net),
  // not the base domain, to keep outbound SendGrid (smtp.sendgrid.net) out.
  // Two corroborators raise confidence, neither is proof:
  //   1. DKIM provisioned through SendGrid's wl002 white-label pool (s1/s2),
  //      which is what allGood's hosted-mailbox docs describe.
  //   2. The domain previously ran Drift on that same subdomain and repointed
  //      it -- allGood is Salesloft's named Drift Email replacement.
  competitor: {
    label: "allGood",
    mx_hosts: ["mx.sendgrid.net"],
    dkim_selectors: ["s1", "s2"],
    dkim_marker: "wl002.sendgrid.net"
  },
  // Split by intent. A live MX on a reply-intent subdomain means they capture
  // inbound replies. Broadcast-only means one-way sending — the no-reply ICP.
  reply_subdomains: ["reply","replies","respond","inbox","hello","hi"],
  broadcast_subdomains: ["email","mail","info","news","go","em","e","m","mailer",
                         "marketing","pages","try","learn"],
  // Recognisable mail infrastructure → vendor name. Config, not code: extend freely.
  vendors: { "driftmail.net":"Drift", "siftrock.com":"Drift (Siftrock)",
             "en25.com":"Oracle Eloqua", "mktomail.com":"Marketo", "mcsv.net":"Mailchimp",
             "sendgrid.net":"SendGrid", "mailgun.org":"Mailgun",
             "sparkpostmail.com":"SparkPost", "amazonaws.com":"AWS SES",
             "mail.protection.outlook.com":"Microsoft 365", "pphosted.com":"Proofpoint",
             "google.com":"Google Workspace", "googlemail.com":"Google Workspace",
             "mimecast.com":"Mimecast", "exacttarget.com":"Salesforce Marketing Cloud",
             "epsl1.com":"Epsilon", "crsend.com":"CRsend", "ascent360.org":"Ascent360" },
  // "Torn down" is only meaningful for a domain we expected to have a record
  // (i.e. the CSV named one). A cold prospect with nothing is "no reply capture",
  // which is a different claim entirely — don't tell a client they churned.
  labels: { drift: "ON DRIFT", allgood_likely: "allGood LIKELY",
            allgood_possible: "allGood POSSIBLE", migrated: "MIGRATED",
            reply: "REPLY CAPTURE", broadcast: "BROADCAST ONLY",
            none: "NO MAIL SUBDOMAIN", dark: "TORN DOWN",
            error: "DNS ERROR", pending: "SCANNING" },
  // Campaign segment per status — what you'd actually build a sequence around.
  segments: { drift: "Tier 0 — sunsetting product, hottest lead",
              allgood_likely: "Tier 0b — INFERRED allGood: inbound-parse MX plus corroboration. Not proof.",
              allgood_possible: "Tier 0b — INFERRED: SendGrid inbound-parse MX only. Shared host, weak signal.",
              migrated: "Tier 0b — already moved, renewal-window callback",
              reply: "Tier 1 — believes in reply management",
              broadcast: "Tier 2 — no-reply sender (inferred), education play",
              none: "Unqualified — no mail subdomain observed",
              dark: "Record torn down",
              error: "Re-run — DNS error, not evidence" }
};
const DOH = [
  (n,t) => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=${t}`,
  (n,t) => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=${t}`,
];
const RRTYPE = { MX: 15, CNAME: 5 };
let rr = 0;

const $ = id => document.getElementById(id);
const results = [];

// ---- CSV parsing (handles quoted fields with embedded newlines) ----
function parseCSV(text) {
  const rows = [[]]; let field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { rows[rows.length-1].push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      rows[rows.length-1].push(field); field = ""; rows.push([]);
    } else field += c;
  }
  rows[rows.length-1].push(field);
  return rows.filter(r => r.some(x => x.trim() !== ""));
}

function detectColumns(rows) {
  const header = rows[0].map(h => h.trim().toLowerCase());
  let dCol = header.findIndex(h => ["basedomain","domain","website","company domain"].includes(h));
  const mxCol = header.findIndex(h => h === "driftmxdomain");
  const coCol = header.findIndex(h => ["company","company name","name"].includes(h));
  let body = rows.slice(1);
  if (dCol === -1) {  // no recognizable header: first column with dots, no header row
    dCol = 0; body = rows.filter(r => (r[0]||"").includes("."));
  }
  return body.map(r => ({
    // Apollo exports domains as "http://www.example.com" — strip scheme, path,
    // port, and a leading www. Probing reply.www.example.com never resolves and
    // silently turns every row into a false negative.
    domain: (r[dCol]||"").trim().toLowerCase()
      .replace(/^https?:\/\//,"").replace(/\/.*$/,"").replace(/:\d+$/,"")
      .replace(/^www\./,""),
    named: mxCol >= 0 ? (r[mxCol]||"").trim().toLowerCase() : "",
    company: coCol >= 0 ? (r[coCol]||"").trim() : "",
  })).filter(r => r.domain.includes("."));
}

// ---- DNS via DoH: hit immediately; confirm miss/error on the other resolver ----
async function resolveRR(name, type) {
  let misses = 0, errors = 0;
  for (let a = 0; a < 3; a++) {
    try {
      const res = await fetch(DOH[rr++ % DOH.length](name, type),
        { headers: { accept: "application/dns-json" }, signal: AbortSignal.timeout(5000) });
      const j = await res.json();
      if (j.Status === 0 && j.Answer) {
        const hosts = [...new Set(j.Answer.filter(x => x.type === RRTYPE[type])
          .map(x => x.data.split(" ").pop().replace(/\.$/,"").toLowerCase()))].sort();
        if (hosts.length) return { s: "hit", hosts };
        if (++misses === 2) return { s: "miss", hosts: [] };
      } else if (j.Status === 3 || j.Status === 0) {   // NXDOMAIN or no answer
        if (++misses === 2) return { s: "miss", hosts: [] };
      } else if (++errors === 2) return { s: "error", hosts: [] };
    } catch { if (++errors === 2) return { s: "error", hosts: [] }; }
  }
  return { s: "error", hosts: [] };
}
const resolveMX = name => resolveRR(name, "MX");

// allGood corroboration: DKIM provisioned via SendGrid's wl002 white-label pool.
// Present => materially more likely allGood. Absent => proves nothing either way.
async function hasCompetitorDKIM(sub) {
  const checks = await Promise.all(FP.competitor.dkim_selectors.map(sel =>
    resolveRR(`${sel}._domainkey.${sub}`, "CNAME")));
  return checks.some(c => c.s === "hit" &&
    c.hosts.some(h => h.includes(FP.competitor.dkim_marker)));
}

const baseDom = h => h.split(".").slice(-2).join(".");
const isDrift = h => FP.mx_hosts.includes(baseDom(h));
// Exact host match — mx.sendgrid.net (inbound parse) only, never smtp.sendgrid.net.
const isCompetitorMX = h => FP.competitor.mx_hosts.includes(h);
const ALL_SUBS = [...FP.reply_subdomains, ...FP.broadcast_subdomains];
const isReplySub = fqdn => FP.reply_subdomains.includes(fqdn.split(".")[0]);
// Longest-suffix match so "mail.protection.outlook.com" wins over "outlook.com".
function vendorOf(hosts) {
  const names = new Set();
  for (const h of hosts) {
    const key = Object.keys(FP.vendors)
      .filter(k => h === k || h.endsWith("." + k))
      .sort((a,b) => b.length - a.length)[0];
    if (key) names.add(FP.vendors[key]);
  }
  return [...names].join(" / ");
}

async function scanDomain(item) {
  // Wildcard probe ×2; on wildcard, answers equal to the baseline don't count.
  const junk = () => "zz9quux-" + Math.random().toString(36).slice(2,8) + "." + item.domain;
  const [p1, p2] = [await resolveMX(junk()), await resolveMX(junk())];
  const wildcard = p1.s === "hit" && p2.s === "hit";
  const baseline = wildcard ? p1.hosts.join(",") : null;

  const subs = [...new Set([item.named, ...ALL_SUBS.map(s => `${s}.${item.domain}`)]
    .filter(Boolean))];
  const out = {};
  for (const sub of subs) {
    let r = await resolveMX(sub);
    if (wildcard && r.s === "hit" && r.hosts.join(",") === baseline) r = { s: "miss", hosts: [] };
    out[sub] = r;
    if (r.s === "hit" && r.hosts.some(isDrift)) break;   // confirmed — stop early
  }

  const hits = Object.entries(out).filter(([,r]) => r.s === "hit");
  const anyErr = Object.values(out).some(r => r.s === "error");

  const done = (status, sub, mx, note) => ({ ...item, status, sub, mx,
    vendor: vendorOf(mx || []), note: note || "", wildcard,
    allSubs: hits.map(([s]) => s.split(".")[0]).join(" ") });

  for (const [sub, r] of hits)
    if (r.hosts.some(isDrift)) return done("drift", sub, r.hosts);

  // allGood: inbound-parse MX. Never asserted as fact — the host is shared, so
  // it is graded by corroboration and always labelled as an inference.
  const agHit = hits.find(([,r]) => r.hosts.some(isCompetitorMX));

  // The named subdomain is the PRIMARY evidence: it is the record we know once
  // ran Drift. Classify on it first, so an unrelated sibling subdomain running
  // inbound parse can't mask where the actual reply capture went.
  if (item.named && out[item.named]?.s === "hit") {
    const namedHosts = out[item.named].hosts;
    if (namedHosts.some(isCompetitorMX)) {
      const dkim = await hasCompetitorDKIM(item.named);
      return done("allgood_likely", item.named, namedHosts,
        ["former Drift subdomain repointed",
         dkim ? `DKIM via ${FP.competitor.dkim_marker}` : null].filter(Boolean).join("; "));
    }
    return done("migrated", item.named, namedHosts,
      agHit ? `inbound-parse MX also seen on ${agHit[0].split(".")[0]}.` : "");
  }

  if (agHit) {
    const [sub, r] = agHit;
    const dkim = await hasCompetitorDKIM(sub);
    return done(dkim ? "allgood_likely" : "allgood_possible", sub, r.hosts,
      dkim ? `DKIM via ${FP.competitor.dkim_marker}` : "");
  }
  // Reply-intent subdomain with live MX → they capture inbound replies.
  const replyHit = hits.find(([sub]) => isReplySub(sub));
  if (replyHit) return done("reply", replyHit[0], replyHit[1].hosts);
  // Only broadcast subdomains → one-way sending. Inference, labelled as such.
  if (hits.length) return done("broadcast", hits[0][0], hits[0][1].hosts,
    item.named ? "expected record gone; broadcast MX only" : "");
  if (anyErr) return done("error", "", []);
  // Nothing resolved: torn down only if we expected a record, else never present.
  return done(item.named ? "dark" : "none", "", []);
}

// ---- UI ----
function chip(status) { return `<span class="chip ${status}">${FP.labels[status]}</span>`; }
function renderRow(el, r) {
  el.innerHTML = `
    <div class="who">
      <div class="name">${r.company || r.domain}${r.wildcard ? '<span class="wild">wildcard DNS</span>' : ""}</div>
      <div class="sub">${r.status === "pending" ? r.domain
        : r.mx.length ? `${r.sub} → ${r.mx.join(", ")}`
        : r.status === "dark" ? (r.note || "expected record no longer resolves")
        : r.status === "error" ? "DNS lookup failed — re-run, not evidence"
        : "no mail subdomain found"}</div>
      ${r.vendor || r.note ? `<div class="vendor">${[r.vendor, r.note].filter(Boolean).join(" · ")}</div>` : ""}
    </div>${chip(r.status)}`;
}
let filter = null;   // active segment filter, null = show all

function paint() {
  const shown = filter ? results.filter(r => r.status === filter) : results;
  $("list").innerHTML = "";
  shown.forEach(r => { const el = document.createElement("div"); el.className = "row";
    renderRow(el, r); $("list").appendChild(el); });
  renderSummary(results, true);
  $("segnote").textContent = filter ? FP.segments[filter] : "";
}

function renderSummary(items, done) {
  const n = s => items.filter(r => r.status === s).length;
  $("summary").style.display = "flex";
  const opt = (st, label, color) => n(st)
    ? `<span class="pill filter${filter === st ? " on" : ""}" data-st="${st}"${color ? ` style="color:${color}"` : ""}><i>${n(st)}</i> ${label}</span>`
    : "";
  $("summary").innerHTML =
    `<span class="pill filter${filter === null ? " on" : ""}" data-st=""><i>${items.length}</i> all</span>` +
    opt("drift", "on Drift", "var(--green)") +
    opt("allgood_likely", "allGood likely", "var(--red)") +
    opt("allgood_possible", "allGood possible", "var(--orange)") +
    opt("migrated", "migrated", "var(--orange)") +
    opt("reply", "reply capture", "var(--accent)") +
    opt("broadcast", "broadcast only", "var(--purple)") +
    opt("dark", "torn down") +
    opt("none", "no mail subdomain") +
    opt("error", "errors", "var(--red)");
  $("summary").querySelectorAll(".pill.filter").forEach(p => p.onclick = () => {
    filter = p.dataset.st || null; paint();
  });
  $("footer").style.display = done ? "flex" : "none";
}

async function run(text) {
  const items = detectColumns(parseCSV(text));
  if (!items.length) { alert("No domain rows found. Expected a BaseDomain/domain column."); return; }
  $("drop").style.display = "none"; $("list").innerHTML = "";
  results.length = 0; filter = null;

  const rowEls = items.map(it => {
    const el = document.createElement("div"); el.className = "row";
    const r = { ...it, status: "pending", mx: [], sub: "" };
    renderRow(el, r); $("list").appendChild(el); return el;
  });
  $("progress").style.display = "block";
  let done = 0;
  // Hottest first. Any status missing here would sort to -1 and float above
  // ON DRIFT, burying the best leads — keep in sync with FP.labels.
  const order = ["drift","allgood_likely","allgood_possible","migrated","reply",
                 "broadcast","dark","none","error"];

  const queue = items.map((it, i) => ({ it, i }));
  async function worker() {
    while (queue.length) {
      const { it, i } = queue.shift();
      const r = await scanDomain(it);
      results[i] = r; renderRow(rowEls[i], r);
      done++; $("ptext").textContent = `Scanning ${done}/${items.length} — live MX lookups`;
      $("pbar").style.width = (100 * done / items.length) + "%";
      renderSummary(results.filter(Boolean), false);
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));

  results.sort((a,b) => order.indexOf(a.status) - order.indexOf(b.status));
  $("progress").style.display = "none";
  paint();
}

$("exportBtn").onclick = () => {
  const esc = v => `"${String(v).replaceAll('"','""')}"`;
  const rows = filter ? results.filter(r => r.status === filter) : results;
  const ag = { allgood_likely: "likely (inferred)", allgood_possible: "possible (inferred)" };
  const csv = ["Status,Campaign Segment,Company,Domain,Mail Subdomain,MX Evidence," +
               "Vendor (inferred),allGood (inferred),allGood Corroboration," +
               "No-Reply Likely (inferred),Mail Subdomains Seen,Wildcard DNS,Date Checked",
    ...rows.map(r => [FP.labels[r.status], FP.segments[r.status], r.company, r.domain,
      r.sub, r.mx.join(" "), r.vendor || "",
      ag[r.status] || "n", ag[r.status] ? (r.note || "MX only") : "",
      r.status === "broadcast" ? "y (inferred)" : "n", r.allSubs || "",
      r.wildcard ? "y" : "n", new Date().toISOString().slice(0,10)]
      .map(esc).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "icp_scan_results.csv"; a.click();
};

$("pickBtn").onclick = () => $("file").click();
$("drop").onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0]?.text().then(run);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over");
  e.dataTransfer.files[0]?.text().then(run); };
window.__run = run;   // programmatic entry point (testing)
</script>
</body>
</html>
