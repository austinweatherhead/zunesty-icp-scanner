<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zunesty ICP Scanner</title>
<style>
  :root {
    --bg: #0c0d0f; --card: #17181c; --card2: #1e2025; --line: #26282e;
    --text: #f2f3f5; --dim: #8b8f98; --accent: #4da3ff;
    --green: #34c98e; --orange: #f5a623; --gray: #6f7480; --red: #ef6461; --purple: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 24px 12px;
  }
  .app { width: 430px; max-width: 100%; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 14px; letter-spacing: .04em; }
  .brand span { color: var(--accent); }
  .btn {
    background: var(--card2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #08131f; }
  .btn:hover { filter: brightness(1.1); }

  .drop {
    margin: 14px; border: 1.5px dashed var(--line); border-radius: 12px;
    padding: 34px 16px; text-align: center; color: var(--dim); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .drop.over { border-color: var(--accent); background: rgba(77,163,255,.06); }
  .drop b { color: var(--text); display: block; margin-bottom: 4px; font-size: 13px; }

  .summary {
    display: none; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .pill {
    font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 999px;
    background: var(--card2); border: 1px solid var(--line); color: var(--dim);
  }
  .pill i { font-style: normal; color: var(--text); }
  .progress { display: none; padding: 10px 16px; color: var(--dim); font-size: 12px;
    border-bottom: 1px solid var(--line); }
  .bar { height: 3px; background: var(--card2); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .bar div { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }

  .list { max-height: 520px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 16px;
    border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .row .who { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .row .sub { color: var(--dim); font-size: 11px; margin-top: 2px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .chip { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    white-space: nowrap; letter-spacing: .02em; }
  .chip.drift    { color: var(--green);  background: rgba(52,201,142,.12); }
  .chip.migrated { color: var(--orange); background: rgba(245,166,35,.13); }
  .chip.dark     { color: var(--gray);   background: rgba(111,116,128,.15); }
  .chip.error    { color: var(--red);    background: rgba(239,100,97,.13); }
  .chip.pending  { color: var(--dim);    background: var(--card2); }
  .wild { color: var(--purple); font-size: 10px; margin-left: 5px; }

  .footer { display: none; padding: 12px 14px; border-top: 1px solid var(--line);
    justify-content: space-between; align-items: center; }
  .footer .note { color: var(--dim); font-size: 11px; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="topbar">
      <div class="brand">ZUNESTY <span>ICP Scanner</span></div>
      <button class="btn" id="pickBtn">Upload CSV</button>
      <input type="file" id="file" accept=".csv,text/csv">
    </div>

    <div class="drop" id="drop">
      <b>Drop a CSV here</b>
      Needs a domain column (e.g. <code>BaseDomain</code>). A <code>DriftMXDomain</code>
      column is used when present; otherwise 15 reply subdomains are probed.
    </div>

    <div class="summary" id="summary"></div>
    <div class="progress" id="progress"><span id="ptext"></span><div class="bar"><div id="pbar"></div></div></div>
    <div class="list" id="list"></div>

    <div class="footer" id="footer">
      <span class="note">Evidence = live MX records via DNS-over-HTTPS. Reproduce any row: <code>dig MX &lt;subdomain&gt;</code></span>
      <button class="btn primary" id="exportBtn">Export CSV</button>
    </div>
  </div>
</div>

<script>
// ---- Fingerprints (derived by Phase 0 on 2026-07-29 — edit here, nothing else) ----
const FP = {
  mx_hosts: ["driftmail.net", "siftrock.com"],      // siftrock = legacy Drift infra
  competitor_mx_hosts: [],
  subdomains: ["reply","hello","e","hi","email","mail","info","go","em","m",
               "replies","inbox","respond","mailer","news"],
  labels: { drift: "ON DRIFT", migrated: "MIGRATED", dark: "TORN DOWN",
            error: "DNS ERROR", pending: "SCANNING" }
};
const DOH = [
  n => `https://cloudflare-dns.com/dns-query?name=${encodeURIComponent(n)}&type=MX`,
  n => `https://dns.google/resolve?name=${encodeURIComponent(n)}&type=MX`,
];
let rr = 0;

const $ = id => document.getElementById(id);
const results = [];

// ---- CSV parsing (handles quoted fields with embedded newlines) ----
function parseCSV(text) {
  const rows = [[]]; let field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { rows[rows.length-1].push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      rows[rows.length-1].push(field); field = ""; rows.push([]);
    } else field += c;
  }
  rows[rows.length-1].push(field);
  return rows.filter(r => r.some(x => x.trim() !== ""));
}

function detectColumns(rows) {
  const header = rows[0].map(h => h.trim().toLowerCase());
  let dCol = header.findIndex(h => ["basedomain","domain","website","company domain"].includes(h));
  const mxCol = header.findIndex(h => h === "driftmxdomain");
  const coCol = header.findIndex(h => ["company","company name","name"].includes(h));
  let body = rows.slice(1);
  if (dCol === -1) {  // no recognizable header: first column with dots, no header row
    dCol = 0; body = rows.filter(r => (r[0]||"").includes("."));
  }
  return body.map(r => ({
    domain: (r[dCol]||"").trim().toLowerCase().replace(/^https?:\/\//,"").replace(/\/.*$/,""),
    named: mxCol >= 0 ? (r[mxCol]||"").trim().toLowerCase() : "",
    company: coCol >= 0 ? (r[coCol]||"").trim() : "",
  })).filter(r => r.domain.includes("."));
}

// ---- DNS via DoH: hit immediately; confirm miss/error on the other resolver ----
async function resolveMX(name) {
  let misses = 0, errors = 0;
  for (let a = 0; a < 3; a++) {
    try {
      const res = await fetch(DOH[rr++ % DOH.length](name),
        { headers: { accept: "application/dns-json" }, signal: AbortSignal.timeout(5000) });
      const j = await res.json();
      if (j.Status === 0 && j.Answer) {
        const hosts = [...new Set(j.Answer.filter(x => x.type === 15)
          .map(x => x.data.split(" ").pop().replace(/\.$/,"").toLowerCase()))].sort();
        if (hosts.length) return { s: "hit", hosts };
        if (++misses === 2) return { s: "miss", hosts: [] };
      } else if (j.Status === 3 || j.Status === 0) {   // NXDOMAIN or no answer
        if (++misses === 2) return { s: "miss", hosts: [] };
      } else if (++errors === 2) return { s: "error", hosts: [] };
    } catch { if (++errors === 2) return { s: "error", hosts: [] }; }
  }
  return { s: "error", hosts: [] };
}

const baseDom = h => h.split(".").slice(-2).join(".");
const isDrift = h => FP.mx_hosts.includes(baseDom(h));
const isCompetitor = h => FP.competitor_mx_hosts.includes(baseDom(h));

async function scanDomain(item) {
  // Wildcard probe ×2; on wildcard, answers equal to the baseline don't count.
  const junk = () => "zz9quux-" + Math.random().toString(36).slice(2,8) + "." + item.domain;
  const [p1, p2] = [await resolveMX(junk()), await resolveMX(junk())];
  const wildcard = p1.s === "hit" && p2.s === "hit";
  const baseline = wildcard ? p1.hosts.join(",") : null;

  const subs = [...new Set([item.named, ...FP.subdomains.map(s => `${s}.${item.domain}`)]
    .filter(Boolean))];
  const out = {};
  for (const sub of subs) {
    let r = await resolveMX(sub);
    if (wildcard && r.s === "hit" && r.hosts.join(",") === baseline) r = { s: "miss", hosts: [] };
    out[sub] = r;
    if (r.s === "hit" && r.hosts.some(isDrift)) break;   // confirmed — stop early
  }

  const hits = Object.entries(out).filter(([,r]) => r.s === "hit");
  const anyErr = Object.values(out).some(r => r.s === "error");
  for (const [sub, r] of hits)
    if (r.hosts.some(isDrift)) return { ...item, status: "drift", sub, mx: r.hosts, wildcard };
  const namedHit = item.named && out[item.named]?.s === "hit" ? out[item.named] : null;
  if (namedHit) return { ...item, status: "migrated", sub: item.named, mx: namedHit.hosts, wildcard };
  for (const [sub, r] of hits)
    if (r.hosts.some(isCompetitor)) return { ...item, status: "migrated", sub, mx: r.hosts, wildcard };
  if (hits.length) return { ...item, status: "dark", sub: hits[0][0], mx: hits[0][1].hosts,
    note: "named record gone; unrelated MX seen", wildcard };
  if (anyErr) return { ...item, status: "error", sub: "", mx: [], wildcard };
  return { ...item, status: "dark", sub: "", mx: [], wildcard };
}

// ---- UI ----
function chip(status) { return `<span class="chip ${status}">${FP.labels[status]}</span>`; }
function renderRow(el, r) {
  el.innerHTML = `
    <div class="who">
      <div class="name">${r.company || r.domain}${r.wildcard ? '<span class="wild">wildcard DNS</span>' : ""}</div>
      <div class="sub">${r.status === "pending" ? r.domain
        : r.mx.length ? `${r.sub} → ${r.mx.join(", ")}`
        : r.note || "no reply subdomain resolves"}</div>
    </div>${chip(r.status)}`;
}
function renderSummary(items, done) {
  const n = s => items.filter(r => r.status === s).length;
  $("summary").style.display = "flex";
  $("summary").innerHTML =
    `<span class="pill"><i>${items.length}</i> domains</span>
     <span class="pill" style="color:var(--green)"><i>${n("drift")}</i> on Drift</span>
     <span class="pill" style="color:var(--orange)"><i>${n("migrated")}</i> migrated</span>
     <span class="pill"><i>${n("dark")}</i> torn down</span>` +
    (n("error") ? `<span class="pill" style="color:var(--red)"><i>${n("error")}</i> errors</span>` : "");
  $("footer").style.display = done ? "flex" : "none";
}

async function run(text) {
  const items = detectColumns(parseCSV(text));
  if (!items.length) { alert("No domain rows found. Expected a BaseDomain/domain column."); return; }
  $("drop").style.display = "none"; $("list").innerHTML = ""; results.length = 0;

  const rowEls = items.map(it => {
    const el = document.createElement("div"); el.className = "row";
    const r = { ...it, status: "pending", mx: [], sub: "" };
    renderRow(el, r); $("list").appendChild(el); return el;
  });
  $("progress").style.display = "block";
  let done = 0;
  const order = ["drift","migrated","dark","error"];

  const queue = items.map((it, i) => ({ it, i }));
  async function worker() {
    while (queue.length) {
      const { it, i } = queue.shift();
      const r = await scanDomain(it);
      results[i] = r; renderRow(rowEls[i], r);
      done++; $("ptext").textContent = `Scanning ${done}/${items.length} — live MX lookups`;
      $("pbar").style.width = (100 * done / items.length) + "%";
      renderSummary(results.filter(Boolean), false);
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));

  results.sort((a,b) => order.indexOf(a.status) - order.indexOf(b.status));
  $("list").innerHTML = "";
  results.forEach(r => { const el = document.createElement("div"); el.className = "row";
    renderRow(el, r); $("list").appendChild(el); });
  $("progress").style.display = "none";
  renderSummary(results, true);
}

$("exportBtn").onclick = () => {
  const esc = v => `"${String(v).replaceAll('"','""')}"`;
  const csv = ["Status,Company,Domain,Reply Subdomain,MX Evidence,Wildcard DNS,Date Checked",
    ...results.map(r => [FP.labels[r.status], r.company, r.domain, r.sub,
      r.mx.join(" "), r.wildcard ? "y" : "n", new Date().toISOString().slice(0,10)]
      .map(esc).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "icp_scan_results.csv"; a.click();
};

$("pickBtn").onclick = () => $("file").click();
$("drop").onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0]?.text().then(run);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over");
  e.dataTransfer.files[0]?.text().then(run); };
window.__run = run;   // programmatic entry point (testing)
</script>
</body>
</html>
